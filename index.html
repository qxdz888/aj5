      .nav-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      /* Logo 缩小 */
      .logo {
        font-size: 14px;
        white-space: nowrap;
      }

      /* 搜索框缩小 */
      .search-container {
        flex-shrink: 0;
      }

      .search-input {
        width: 100px;
        font-size: 12px;
        padding: 6px 25px 6px 10px;
      }

      .search-input:focus {
        width: 120px;
      }

      .search-icon {
        font-size: 12px;
        right: 8px;
      }

      /* 第二行：导航按钮 + 招商与售后（横向滚动） */
      .nav-bottom-row {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .nav-bottom-row::-webkit-scrollbar {
        display: none;
      }

      .nav-links {
        gap: 6px;
        flex-shrink: 0;
      }

      .banner {
        margin-top: 120px;  /* 两行导航栏的高度 */
        height: 350px;
      }

      /* 页面内容顶部间距 */
      .page-content {
        padding-top: 120px;
      }

      .banner-title {
        font-size: 28px;
      }

      .banner-subtitle {
        font-size: 14px;
      }

      /* 图片网格 */
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }

      .card-info {
        padding: 14px;
      }

      .card-name {
        font-size: 13px;
      }

      .card-price {
        font-size: 16px;
      }

      .section-header {
        margin-top: 30px;
      }

      /* 招商与售后按钮 */
      .nav-contact {
        display: inline-block !important;
        padding: 6px 12px;
        font-size: 12px;
        flex-shrink: 0;
        white-space: nowrap;
        margin-left: 0;
        border-radius: 20px;
      }

      /* 手机端下拉菜单优化 */
      .nav-dropdown-content {
        position: fixed;
        left: 10px;
        right: 10px;
        top: auto;
        bottom: auto;
        max-height: 60vh;
        overflow-y: auto;
      }

      /* 底部栏手机适配 */
      .bottom-bar {
        height: auto;
        padding: 12px 20px;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .bottom-bar-item span {
        font-size: 13px;
      }
    }

    /* 加载更多按钮 */
    .load-more-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
    }

    .load-more-btn {
      padding: 12px 40px;
      background: linear-gradient(135deg, #e74c3c 0%, #ff6b6b 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .load-more-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
    }

    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 手机尺寸（宽度 <= 480px） */
    @media (max-width: 480px) {
      /* 图片网格：固定2列布局 */
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .banner-title {
        font-size: 22px;
      }

      .nav-btn {
        padding: 6px 12px;
        font-size: 11px;
      }

      .load-more-btn {
        padding: 10px 30px;
        font-size: 13px;
      }
    }

    /* ==========================================================================
       ============  节日版 UI 皮肤（日常版 / 节日版 双 UI 体系）  ============
       ==========================================================================
       说明：以下全部规则都用 body.festival-mode 前缀，只在节日模式生效。
             日常模式（body 没有 .festival-mode）时，完全不受影响。
             配色：暗红炭黑底 + 金色强调；详见各段注释里的色值。
       ========================================================================== */

    /* --- 节日版配色变量 --- */
    body.festival-mode {
      /* 背景层 */
      --f-bg-page: #140808;      /* 页面底：暗红炭黑 */
      --f-bg-card: #1F0D0D;      /* 卡片底 */
      --f-bg-elevated: #2A1212;  /* 浮层 / 下拉菜单底 */
      --f-bg-nav: rgba(20, 8, 8, 0.95);  /* 导航栏半透明底 */

      /* 金色层（节日唯一强调色） */
      --f-gold: #E8C46A;         /* 主金：描边 / 特惠价 */
      --f-gold-bright: #FFD97A;  /* 亮金：hover / 高亮 */
      --f-gold-deep: #B8902F;    /* 暗金：渐变暗部 */
      --f-gold-line: rgba(232, 196, 106, 0.28);  /* 金色细线 */
      --f-gold-glow: rgba(232, 196, 106, 0.22);  /* 金色光晕 */

      /* 红层（氛围，克制使用） */
      --f-red-deep: #8B1A1A;
      --f-red-main: #C1272D;
      --f-red-bright: #E63946;

      /* 文字层（暖白系，对比度 ≥ 4.5:1） */
      --f-text-main: #FFF5E6;    /* 主文字 on #140808 ≈ 17.2:1 */
      --f-text-sub: #D4C4B0;     /* 次级文字 ≈ 11.4:1 */
      --f-text-muted: #9A8A7A;   /* 弱化文字 ≈ 5.1:1 */
    }

    /* --- 页面整体：暗红炭黑底 + 顶部金色辉光 --- */
    body.festival-mode {
      background: var(--f-bg-page);
      color: var(--f-text-main);
      background-image:
        radial-gradient(ellipse 900px 420px at 50% -80px,
          rgba(232, 196, 106, 0.13) 0%,
          rgba(232, 196, 106, 0.05) 45%,
          transparent 75%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 模式切换时颜色平滑过渡 */
    body {
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    /* --- 顶部导航栏：暗红底 + 金色细线 --- */
    body.festival-mode .navbar {
      background: var(--f-bg-nav);
      border-bottom: 1px solid var(--f-gold-line);
      box-shadow: 0 1px 0 rgba(232, 196, 106, 0.10),
                  0 8px 28px rgba(0, 0, 0, 0.5);
    }

    /* Logo：白灰渐变 → 亮金到暗金渐变 */
    body.festival-mode .logo {
      background: linear-gradient(135deg, var(--f-gold-bright) 0%, var(--f-gold-deep) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 导航按钮：淡金描边 + 暖灰文字 */
    body.festival-mode .nav-btn {
      border-color: rgba(232, 196, 106, 0.22);
      color: var(--f-text-sub);
    }

    body.festival-mode .nav-btn:hover {
      border-color: var(--f-gold);
      color: var(--f-gold-bright);
      background: rgba(232, 196, 106, 0.06);
    }

    /* 选中态：金底深字（原站是白底黑字） */
    body.festival-mode .nav-btn.active {
      background: linear-gradient(135deg, var(--f-gold) 0%, var(--f-gold-deep) 100%);
      color: #2A1206;
      border-color: var(--f-gold-bright);
      box-shadow: 0 2px 12px rgba(232, 196, 106, 0.28);
    }

    body.festival-mode .nav-arrow {
      color: var(--f-gold);
    }

    /* 搜索框 */
    body.festival-mode .search-input {
      border-color: rgba(232, 196, 106, 0.22);
      background: rgba(232, 196, 106, 0.05);
      color: var(--f-text-main);
    }

    body.festival-mode .search-input::placeholder {
      color: var(--f-text-muted);
    }

    body.festival-mode .search-input:focus {
      border-color: var(--f-gold);
      background: rgba(232, 196, 106, 0.10);
      box-shadow: 0 0 0 3px rgba(232, 196, 106, 0.12);
    }

    body.festival-mode .search-icon {
      color: var(--f-gold);
    }

    body.festival-mode .search-results-count {
      color: var(--f-text-muted);
    }

    /* --- 两级下拉菜单：暗红浮层底 + 金边框 --- */
    body.festival-mode .nav-dropdown-content {
      background: var(--f-bg-elevated);
      border: 1px solid var(--f-gold-line);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(232, 196, 106, 0.06) inset;
    }

    body.festival-mode .nav-dropdown-content .nav-btn:hover {
      background: rgba(232, 196, 106, 0.14);
      color: var(--f-gold-bright);
    }

    /* 下拉项选中：金色实底 + 深棕字，和普通项区分开 */
    body.festival-mode .nav-dropdown-content .nav-btn.active {
      background: linear-gradient(135deg, rgba(232, 196, 106, 0.9) 0%,
                                          rgba(184, 144, 47, 0.9) 100%);
      color: #2A1206;
    }

    /* --- Banner 区：暗红渐变 + 金色标题发光 --- */
    body.festival-mode .banner {
      background: linear-gradient(135deg, #2A1212 0%, #140808 55%, #1F0D0D 100%);
    }

    /* Banner 背景图：压暗并染成节日暖调 */
    body.festival-mode .banner::before {
      opacity: 0.18;
      filter: sepia(0.35) hue-rotate(-12deg) saturate(1.25);
    }

    body.festival-mode .banner-title {
      background: linear-gradient(180deg, #FFF5E6 0%, var(--f-gold) 60%, var(--f-gold-deep) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 22px rgba(232, 196, 106, 0.35));
    }

    body.festival-mode .banner-subtitle {
      color: var(--f-text-sub);
      letter-spacing: 4px;
    }

    /* --- 分类标题：金色 + 两侧渐变金线 --- */
    body.festival-mode .section-title {
      color: var(--f-gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    body.festival-mode .section-title::before,
    body.festival-mode .section-title::after {
      content: '';
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--f-gold-line), transparent);
    }

    /* --- 商品卡片：暗红底 + 淡金边 + 淡淡金色光晕 --- */
    body.festival-mode .card {
      background: var(--f-bg-card);
      border: 1px solid var(--f-gold-line);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45),
                  0 0 20px rgba(232, 196, 106, 0.07);
      /* 卡片顶部一道极淡金高光 */
      background-image: linear-gradient(180deg,
          rgba(232, 196, 106, 0.07) 0%,
          transparent 90px);
    }

    body.festival-mode .card:hover {
      border-color: var(--f-gold);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55),
                  0 0 32px var(--f-gold-glow);
    }

    body.festival-mode .card-name {
      color: var(--f-text-main);
    }

    body.festival-mode .card-category {
      background: rgba(232, 196, 106, 0.12);
      color: var(--f-gold);
      border: 1px solid rgba(232, 196, 106, 0.22);
    }

    /* --- ★ 价格三件套：节日版最核心的「卖货」视觉 ---
       .price-origin  原价文字（价格引擎新增，平时就是原价）
       .original-price 原价删除线
       .special-price  特惠价 —— 日常版红色，节日版换成金色发光大字
    */
    body.festival-mode .card-price {
      font-size: 14px;
      color: var(--f-text-main);
    }

    body.festival-mode .original-price {
      color: var(--f-text-muted);
      text-decoration-color: rgba(232, 196, 106, 0.55);  /* 删除线也染金 */
      text-decoration-thickness: 1.5px;
    }

    /* 原价文字版（价格引擎新增类） */
    body.festival-mode .price-origin {
      color: var(--f-text-muted);
    }

    /* 特惠价：亮金 + 放大 + 发光，形成价格锚点 */
    body.festival-mode .special-price {
      color: var(--f-gold-bright);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 14px rgba(232, 196, 106, 0.55),
                   0 0 3px rgba(255, 217, 122, 0.6);
    }

    /* --- 卡片购买按钮：微信绿是功能色，刻意保留，只加金边 --- */
    body.festival-mode .card-buy-btn {
      border: 1px solid var(--f-gold-line);
      color: var(--f-gold);
      background: rgba(232, 196, 106, 0.05);
    }

    body.festival-mode .card-buy-btn:hover {
      background: linear-gradient(135deg, var(--f-gold) 0%, var(--f-gold-deep) 100%);
      border-color: var(--f-gold-bright);
      color: #2A1206;
      box-shadow: 0 4px 16px rgba(232, 196, 106, 0.3);
    }

    /* --- 大图弹窗：暗红黑遮罩 + 金色描边 --- */
    body.festival-mode .modal {
      background: rgba(10, 4, 4, 0.96);
      backdrop-filter: blur(6px);
    }

    body.festival-mode .modal-image {
      box-shadow: 0 0 0 1px var(--f-gold-line),
                  0 0 48px rgba(232, 196, 106, 0.28);
    }

    body.festival-mode .modal-name {
      color: var(--f-text-main);
    }

    body.festival-mode .modal-price {
      color: #fff;
    }

    /* 弹窗内的价格各段：金色高亮 */
    body.festival-mode .modal-price .price-origin {
      color: var(--f-text-muted);
    }

    body.festival-mode .modal-price .special-price {
      color: var(--f-gold-bright);
      text-shadow: 0 0 18px rgba(232, 196, 106, 0.6);
    }

    /* 弹窗内运费说明：节日版用金色更醒目（原站 promo 态是 #ffb400 橙色） */
    body.festival-mode .modal-shipping {
      color: var(--f-text-sub);
    }

    body.festival-mode .modal-shipping.promo {
      color: var(--f-gold-bright);
      text-shadow: 0 0 12px rgba(232, 196, 106, 0.4);
    }

    /* 弹窗联系方式卡片 */
    body.festival-mode .modal-contact {
      background: var(--f-bg-card);
      border: 1px solid var(--f-gold-line);
      box-shadow: 0 0 24px rgba(232, 196, 106, 0.08);
    }

    body.festival-mode .modal-contact-title {
      color: var(--f-gold);
    }

    body.festival-mode .modal-wechat-label {
      color: var(--f-text-muted);
    }

    body.festival-mode .modal-wechat-id {
      color: var(--f-text-main);
    }

    /* 复制按钮：保持微信绿（功能色），加金边点缀 */
    body.festival-mode .modal-copy-btn {
      background: #07c160;
      box-shadow: 0 0 0 1px var(--f-gold-line);
    }

    body.festival-mode .modal-copy-btn:hover {
      background: #06ad56;
      box-shadow: 0 0 0 1px var(--f-gold),
                  0 4px 14px rgba(7, 193, 96, 0.35);
    }

    body.festival-mode .modal-copy-btn.copied {
      background: #2A1212;
      color: var(--f-text-muted);
    }

    body.festival-mode .modal-close {
      color: var(--f-gold);
      font-size: 34px;
      text-shadow: 0 0 12px rgba(232, 196, 106, 0.5);
    }

    body.festival-mode .modal-close:hover {
      color: var(--f-gold-bright);
    }

    /* --- 底部固定栏 --- */
    body.festival-mode .bottom-bar {
      background: rgba(20, 8, 8, 0.98);
      border-top: 1px solid var(--f-gold-line);
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.5);
    }

    body.festival-mode .bottom-bar-item {
      color: var(--f-text-sub);
    }

    body.festival-mode .bottom-bar-item:hover {
      color: var(--f-gold-bright);
    }

    body.festival-mode .bottom-bar-recruitment {
      background: linear-gradient(135deg, var(--f-gold) 0%, var(--f-gold-deep) 100%);
      color: #2A1206;
      box-shadow: 0 4px 16px rgba(232, 196, 106, 0.28);
    }

    body.festival-mode .bottom-bar-recruitment:hover {
      background: linear-gradient(135deg, var(--f-gold-bright) 0%, var(--f-gold) 100%);
      color: #2A1206;
    }

    /* --- 加载更多按钮：改成红底金边，避免和特惠价金色撞色 --- */
    body.festival-mode .load-more-btn {
      background: linear-gradient(135deg, var(--f-red-main) 0%, var(--f-red-deep) 100%);
      border: 1px solid var(--f-gold-line);
      color: var(--f-text-main);
      box-shadow: 0 0 20px rgba(193, 39, 45, 0.25);
    }

    body.festival-mode .load-more-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(193, 39, 45, 0.45),
                  0 0 0 1px var(--f-gold);
    }

    body.festival-mode .load-more-btn:disabled {
      opacity: 0.45;
      transform: none;
      box-shadow: none;
    }

    body.festival-mode .empty-state {
      color: var(--f-text-muted);
    }

    /* --- 导航栏「联系购买」按钮：保留微信绿，加金边 --- */
    body.festival-mode .nav-contact {
      box-shadow: 0 0 0 1px var(--f-gold-line),
                  0 4px 18px rgba(7, 193, 96, 0.28);
    }

    body.festival-mode .nav-contact:hover {
      box-shadow: 0 0 0 1px var(--f-gold),
                  0 6px 22px rgba(7, 193, 96, 0.42);
    }

    /* ==========================================================================
       日常 / 节日 切换按钮（#uiModeToggle）
       位置：固定右上角，特意避开导航栏的搜索框
       ========================================================================== */
    #uiModeToggle {
      position: fixed;
      top: 96px;                     /* 避开导航栏两行高度 */
      right: 20px;
      z-index: 900;                  /* 高于导航(100)，低于弹窗(1000) */
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      /* 日常态：半透明黑底 + 白描边（贴合原站风格） */
      background: rgba(20, 20, 20, 0.88);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
    }

    #uiModeToggle:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    }

    #uiModeToggle:active {
      transform: translateY(0) scale(0.97);
    }

    /* 节日态：金色渐变底 + 金边 + 金色发光 */
    body.festival-mode #uiModeToggle {
      background: linear-gradient(135deg, rgba(232, 196, 106, 0.18) 0%,
                                          rgba(184, 144, 47, 0.12) 100%);
      border-color: var(--f-gold);
      color: var(--f-gold-bright);
      box-shadow: 0 0 0 1px rgba(232, 196, 106, 0.2),
                  0 4px 20px rgba(232, 196, 106, 0.3);
    }

    body.festival-mode #uiModeToggle:hover {
      border-color: var(--f-gold-bright);
      box-shadow: 0 0 0 1px rgba(232, 196, 106, 0.4),
                  0 6px 26px rgba(232, 196, 106, 0.45);
    }

    #uiModeToggle .toggle-icon {
      font-size: 15px;
      line-height: 1;
    }

    /* 状态小圆点：日常=灰，节日=金色呼吸 */
    #uiModeToggle .toggle-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s ease;
    }

    body.festival-mode #uiModeToggle .toggle-dot {
      background: var(--f-gold-bright);
      box-shadow: 0 0 8px var(--f-gold-bright);
      animation: festivalPulse 2s ease-in-out infinite;
    }

    @keyframes festivalPulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.8); }
    }

    /* 尊重系统「减弱动态效果」 */
    @media (prefers-reduced-motion: reduce) {
      #uiModeToggle,
      #uiModeToggle .toggle-dot,
      body.festival-mode #uiModeToggle .toggle-dot {
        animation: none;
        transition: none;
      }
    }

    /* 切换按钮手机端适配 */
    @media (max-width: 768px) {
      #uiModeToggle {
        top: 92px;
        right: 12px;
        padding: 7px 13px;
        font-size: 12px;
        gap: 5px;
        border-radius: 18px;
      }
      #uiModeToggle .toggle-icon { font-size: 14px; }
    }

    @media (max-width: 480px) {
      #uiModeToggle {
        top: 88px;
        right: 10px;
        padding: 6px 11px;
        font-size: 11px;
      }
    }

    /* ==========================================================================
       节日横幅（#festivalBanner）
       默认 display:none，仅节日模式显示；文案由 JS 按 isPromoNow() 动态写入

       ⚠️ 定位说明（重要）：
       .navbar 是 position:fixed，原 .banner 用 margin-top:70px 来避让它。
       横幅插在 nav 与 .banner 之间，若不处理会正好落在 navbar 底下被盖住。
       因此这里给横幅自身也加同样的避让外边距，让它出现在导航栏正下方；
       同时把 .banner 的 margin-top 清零（由本横幅顶替），避免出现双份空隙。
       ========================================================================== */
    #festivalBanner {
      display: none;                 /* ★ 默认隐藏（日常模式） */
      position: relative;
      width: 100%;
      /* 避让 fixed 导航栏：桌面端导航为「Logo 行 + 按钮行」两行，
         实测 navbar 底部边界在 101px（含 1px 底边框），故取 102px 留 1px 净空。
         原 .banner 只有 70px 且自身高 500px 所以看不出问题，
         横幅很矮，必须给足，否则文字会被导航栏切掉。 */
      margin-top: 102px;
      background: linear-gradient(135deg, #8B1A1A 0%, #C1272D 50%, #8B1A1A 100%);
      color: #FFF5E6;
      text-align: center;
      padding: 14px 20px;
      overflow: hidden;
      border-top: 1px solid rgba(232, 196, 106, 0.55);
      border-bottom: 1px solid rgba(232, 196, 106, 0.55);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45),
                  0 0 32px rgba(193, 39, 45, 0.28);
      transform: translateY(-100%);
      opacity: 0;
    }

    /* 横幅显示时，把后面 .banner 原本的 70px 避让去掉，
       改由横幅自身的 100px 承担，避免两段空隙叠加。 */
    body.festival-mode #festivalBanner ~ .banner {
      margin-top: 0;
    }

    /* 节日模式 → 显示并播放下落动画 */
    body.festival-mode #festivalBanner {
      display: block;
      animation: bannerDrop 0.5s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }

    @keyframes bannerDrop {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* 斜向金色流光：营造促销动感，4 秒循环一次 */
    #festivalBanner::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 45%;
      height: 100%;
      background: linear-gradient(105deg,
          transparent 0%,
          rgba(255, 217, 122, 0.20) 45%,
          rgba(255, 217, 122, 0.32) 50%,
          rgba(255, 217, 122, 0.20) 55%,
          transparent 100%);
      animation: bannerShine 4s ease-in-out infinite;
      pointer-events: none;          /* 不挡点击 */
    }

    @keyframes bannerShine {
      0%        { left: -60%; }
      55%, 100% { left: 130%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #festivalBanner::after { animation: none; }
      body.festival-mode #festivalBanner {
        animation: none;
        transform: none;
        opacity: 1;
      }
    }

    #festivalBanner .banner-inner {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* 节日名主标题：金色渐变字 */
    #festivalBanner .festival-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #FFF8E8 0%, #FFD97A 55%, #E8C46A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(232, 196, 106, 0.5));
      white-space: nowrap;
    }

    /* 活动副文案：暖浅金，红底对比 ≈ 6.9:1 */
    #festivalBanner .festival-desc {
      font-size: 13px;
      color: #FFE9C8;
      letter-spacing: 1px;
    }

    #festivalBanner .festival-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 233, 200, 0.6);
      flex-shrink: 0;
    }

    #festivalBanner .festival-cta {
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid rgba(255, 233, 200, 0.7);

      color: #FFF8E8;
      cursor: pointer;

    }

    #festivalBanner .festival-cta:hover {
      background: #FFD97A;
      border-color: #FFD97A;
      color: #2A1206;
    }

    /* 横幅手机端适配 */
    @media (max-width: 768px) {
      #festivalBanner {
        padding: 11px 14px;
        margin-top: 95px;            /* 手机端导航两行，实测约 90px，留 95px 余量 */
      }
      #festivalBanner .banner-inner { gap: 9px; }

      #festivalBanner .festival-cta { display: none; }  /* 小屏优先保证文案可读 */
    }

    /* 首屏只内联部分数据（体积更小、渲染更快），全量数据后台静默加载 */
    let allLoaded = false;
    async function loadAllShoes() {
      try {
        const res = await fetch('manifest.json?t=' + Date.now());
        const data = await res.json();
        const known = new Set(shoes.map(s => s.id));
        const strip = u => (u || '').replace(/^https?:\/\/aj5\.netlify\.app\//, '');
        const add = (data.shoes || [])
          .filter(s => !known.has(s.id))
          .map(s => Object.assign({}, s, {
            image: strip(s.image),
            thumb: strip(s.thumb)
          }));
        if (add.length) shoes.push(...add);
        allLoaded = true;
        if (currentSearchTerm) {
          performSearch(searchInput.value);
        } else if (currentCategory !== 'all') {
          renderGallery(currentCategory);
        } else {
          const box = document.getElementById('loadMoreContainer');
          if (box) box.style.display = displayCount < filteredShoes.length ? 'block' : 'none';
        }
        console.log('[aj5] 全量数据就绪：' + shoes.length + ' 件');
      } catch (e) {
        console.warn('[aj5] 全量数据加载失败，仅显示首屏数据', e);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadAllShoes);
    } else {
      setTimeout(loadAllShoes, 0);
    }

    // 国内图床加载失败时自动回退 jsDelivr（CloudBase 到期/超额度的兜底，每张图只回退一次）
    const CDN_MAIN = "https://workbuddy-d5g0sqo2r36ca45b3-1253831416.tcloudbaseapp.com/";
    const CDN_FALLBACK = "https://cdn.jsdelivr.net/gh/qxdz888/aj5@main/";

    /* ============================
       11.1b 节假日特惠价格引擎
       ============================

       规则（老板确认版）：
       1) topCategory === 'aj' 的鞋：平时 129 元，节日特惠期同样 129 元（价格不变，
          特惠期只是追加一行节日特惠文案）。
       2) 非 aj（潮ng / 潮rez / 自z / 鸿b）：
            平时   —— 只显示原价（不显示任何特惠行）
            特惠期 —— 显示原价 + 节日特惠价（原价 − 10 元），无价格下限保护
       3) 特惠区间：节前 5 天（含） → 节日结束 → 节后 1 天（含）
          例：中秋 9/25–9/27 → 9/20 ~ 9/28（含两端）
       4) 全部按页面加载当天的本地日期动态计算，不写死

       节假日来源：国务院办公厅国办发明电〔2025〕7号
    */

    // AJ 系列的固定展示价（平时与特惠期都是这个价）
    const AJ_PRICE = 129;

    // 非 aj 商品的节日降价幅度
    const PROMO_CUT = 10;

    // 节前提前几天进入特惠
    const PROMO_DAYS_BEFORE = 5;

    // 节后延迟几天结束特惠
    const PROMO_DAYS_AFTER = 1;

    // 节日表（清明用「踏青特惠价」，其余用「节日特惠价」）
    const FESTIVALS = [
      { year: 2026, key: 'midautumn',   name: '中秋节', start: '2026-09-25', end: '2026-09-27', promoLabel: '节日特惠价' },
      { year: 2026, key: 'nationalday', name: '国庆节', start: '2026-10-01', end: '2026-10-07', promoLabel: '节日特惠价' },
      { year: 2027, key: 'newyear',     name: '元旦',   start: '2027-01-01', end: '2027-01-03', promoLabel: '节日特惠价' },
      { year: 2027, key: 'qingming',    name: '清明节', start: '2027-04-04', end: '2027-04-06', promoLabel: '踏青特惠价' }
    ];

    // 把 "YYYY-MM-DD" 转成当天 00:00 的本地 Date（避免 UTC 解析导致的差一天）
    function parseDay(str) {
      const p = String(str).split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    // 抹掉时分秒，只留当天 00:00，便于按「天」比较
    function dayStart(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    // 在日期上加减天数
    function addDays(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    // 把 Date 格式化成 YYYY-MM-DD（本地时区）
    function fmtDay(d) {
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + day;
    }

    /**
     * 判断传入日期是否处于某个节日的特惠区间内。
     * @param {Date} date 要判断的日期，不传则用今天
     * @returns {{active: boolean, festival: object|null}} festival 为命中的节日（含 promoLabel）
     */
    function isPromoNow(date) {
      const today = dayStart(date || new Date());
      for (const f of FESTIVALS) {
        const promoStart = addDays(parseDay(f.start), -PROMO_DAYS_BEFORE); // 节前 5 天
        const promoEnd = addDays(parseDay(f.end), PROMO_DAYS_AFTER);       // 节后 1 天
        if (today >= promoStart && today <= promoEnd) {
          return {
            active: true,
            festival: Object.assign({}, f, {
              promoStart: promoStart,
              promoEnd: promoEnd
            })
          };
        }
      }
      return { active: false, festival: null };
    }

    // 取「原价」数字（从 "79元" 这样的字符串里解析）
    function parsePriceValue(price) {
      if (typeof price === 'number') return price;
      const m = String(price == null ? '' : price).match(/\d+/);
      return m ? Number(m[0]) : 0;
    }

    /**
     * 计算某双鞋当前应展示的价格。
     * @param {object} shoe 商品对象
     * @param {Date} [date] 可选，指定「今天」；不传则用页面打开当天的系统日期
     * @returns {{isAj:boolean, display:string, original:string|null, special:string|null,
     *            promoLabel:string|null, isPromo:boolean, festival:object|null}}
     *   display —— 直接铺进卡片的 HTML 片段
     */
    function calcPrice(shoe, date) {
      const promo = isPromoNow(date);
      const isAj = shoe.topCategory === 'aj';

      if (isAj) {
        // AJ：任何时候都是 129 元。特惠期额外显示一行特惠文案（文案随节日切换）
        if (promo.active) {
          return {
            isAj: true,
            display: `<span class="special-price">${promo.festival.promoLabel} ${AJ_PRICE}元</span>`,
            original: null,
            special: AJ_PRICE + '元',
            promoLabel: promo.festival.promoLabel,
            isPromo: true,
            festival: promo.festival
          };
        }
        return {
          isAj: true,
          display: `<span class="special-price">${AJ_PRICE}元</span>`,
          original: null,
          special: AJ_PRICE + '元',
          promoLabel: null,
          isPromo: false,
          festival: null
        };
      }

      // 非 aj
      if (promo.active) {
        const originalStr = String(shoe.price);
        const promoValue = parsePriceValue(shoe.price) - PROMO_CUT; // 无下限保护，按规则直接减 10
        return {
          isAj: false,
          display: `<span class="price-origin">原价：${originalStr}</span>`
                 + `<span class="special-price">${promo.festival.promoLabel} ${promoValue}元</span>`,
          original: originalStr,
          special: promoValue + '元',
          promoLabel: promo.festival.promoLabel,
          isPromo: true,
          festival: promo.festival
        };
      }

      // 非 aj 平时：只显示原价，不显示特惠行
      return {
        isAj: false,
        display: String(shoe.price),
        original: String(shoe.price),
        special: null,
        promoLabel: null,
        isPromo: false,
        festival: null
      };
    }

    // 运费文案：平时 7 元，特惠期两双以上包邮
    function getShippingText(isPromo) {
      return isPromo ? '一双运费 7 元 · 两双以上包邮' : '运费 7 元';
    }

    const modalPrice = document.getElementById('modalPrice'); // 弹窗里的价格
    const modalShipping = document.getElementById('modalShipping'); // 弹窗里的运费说明
    const modalClose = document.getElementById('modalClose'); // 弹窗关闭按钮
    const navBtns = document.querySelectorAll('.nav-btn');   // 所有导航按钮
    const sectionTitle = document.querySelector('.section-title'); // 分类标题
    const searchInput = document.getElementById('searchInput'); // 搜索输入框
    const searchResultsCount = document.getElementById('searchResultsCount'); // 搜索结果计数

    /* ============================
       11.3 渲染图片函数【已修改】
       
       功能：根据传入的分类，筛选并显示对应的鞋子卡片
       
       参数：category - 要显示的分类名，'all' 表示显示全部
       或者传入逗号分隔的字符串，如 "乔一,空军,小空军"
    */
    // 事件委托：卡片点击（只需绑定一次，不需要每次重新绑定）
    gallery.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (card) {
        openModal(parseInt(card.dataset.id));
      }
    });

    /* ============================
       11.3 渲染图片函数【已修改：分页加载】
    ============================ */
    function renderGallery() {
      // 1) 先按大分类 / 小分类筛选
      let base;
      if (currentTop === 'all') {
        base = shoes;                                   // 全部
      } else {
        base = shoes.filter(s => {
          if (s.topCategory !== currentTop) return false;
          // subCategory 为空串 "" 表示直接挂大类的图，点主导航时要一起显示
          if (currentSub && s.subCategory !== currentSub) return false;
          return true;
        });
      }

      // 2) 再叠加搜索关键词（跨全部字段，按 name 搜仍是主路径）
      if (currentSearchTerm) {
        const t = currentSearchTerm;
        filteredShoes = base.filter(shoe =>
          (shoe.name && shoe.name.toLowerCase().includes(t)) ||
          (shoe.price && shoe.price.toLowerCase().includes(t)) ||
          (shoe.category && shoe.category.toLowerCase().includes(t)) ||
          (shoe.topCategory && shoe.topCategory.toLowerCase().includes(t)) ||
          (shoe.subCategory && shoe.subCategory.toLowerCase().includes(t))
        );
      } else {
        filteredShoes = base;
      }

      // 没有内容，显示空状态提示
      if (filteredShoes.length === 0) {
        gallery.innerHTML = '<div class="empty-state">暂无该分类的鞋款</div>';
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
      }

      // 重置分页，加载第一页（替换模式）
      displayCount = 0;
      loadMore(false);
    }

    /* ============================
       11.3b 加载更多（分页核心）
       ============================ */
    function loadMore(append) {
      if (isLoading) return;
      if (!append && displayCount >= filteredShoes.length) return;

      isLoading = true;
      const batch = filteredShoes.slice(displayCount, displayCount + PAGE_SIZE);

      if (batch.length === 0) {
        isLoading = false;
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
      }

      const html = batch.map((shoe, i) => {
        const eager = !append && i < 8;
        // 价格由价格引擎动态计算（平时 / 节日特惠期）
        const price = calcPrice(shoe);
        return `
        <div class="card" data-id="${shoe.id}">
          ${cardBadge(shoe, price)}${newBadge(shoe)}
          <img class="card-image" src="${getShoeThumb(shoe)}" alt="${shoe.name}" loading="${eager ? 'eager' : 'lazy'}"${eager ? ' fetchpriority="high"' : ''} decoding="async" onerror="imgFallback(this)">
          <div class="card-info">
            <h3 class="card-name">${shoe.name}</h3>
            <p class="card-price">
              ${price.display}
            </p>
            <span class="card-category">${shoe.category}</span>
          </div>
        </div>
      `;
      }).join('');

      if (append) {
        gallery.insertAdjacentHTML('beforeend', html);
      } else {
        gallery.innerHTML = html;
      }

      displayCount += batch.length;
      isLoading = false;

      // 显示/隐藏加载更多按钮
      const hasMore = displayCount < filteredShoes.length;
      document.getElementById('loadMoreContainer').style.display = hasMore ? 'block' : 'none';

      // 更新搜索结果计数
      if (currentSearchTerm) {
        searchResultsCount.textContent = `搜索 "${currentSearchTerm}" 找到 ${filteredShoes.length} 个结果`;
        searchResultsCount.style.display = 'block';
      } else {
        searchResultsCount.style.display = 'none';
      }
    }

    /* ============================
       11.4 搜索功能函数【已修改：支持分页】
    ============================ */
    function performSearch(keyword) {
      currentSearchTerm = (keyword || '').trim().toLowerCase();
      // 分类筛选 + 搜索筛选统一在 renderGallery 内处理（会重置分页）
      renderGallery();
    }

    /* ============================
       11.4 打开弹窗函数【已修改】
       
       功能：显示点击的鞋子的大图和详细信息
       
       参数：id - 鞋子的编号
    */
    function openModal(id) {
      // 从 shoes 数组中找到对应 id 的鞋子
      const shoe = shoes.find(s => s.id === id);
      if (!shoe) return;  // 没找到就退出

      // 使用大图路径
      modalImage.dataset.fallback = '';
      modalImage.onerror = function () { imgFallback(this); };
      modalImage.src = getShoeImage(shoe);
      modalName.textContent = shoe.name;      // 设置名称文字

      // 价格：统一走价格引擎（AJ 恒 129；非 aj 平时只显示原价、特惠期显示原价+节日特惠价）
      const price = calcPrice(shoe);
      modalPrice.innerHTML = price.display;

      // 运费：平时 7 元；节日特惠期两双以上包邮
      modalShipping.textContent = getShippingText(price.isPromo);
      modalShipping.classList.toggle('promo', price.isPromo);

      modal.classList.add('active');          // 显示弹窗（添加 .active 类）
      document.body.style.overflow = 'hidden'; // 禁止页面滚动
    }

    /* ============================
       11.5 关闭弹窗函数
       ============================ */
    function closeModal() {
      modal.classList.remove('active');        // 隐藏弹窗
      document.body.style.overflow = '';       // 恢复页面滚动
    }

    /* ============================
       11.6 切换分类函数【已修改】
       ============================

       功能：点击导航按钮时，更新选中状态并刷新图片展示
       主菜单点击时展开下拉菜单，点击其他主菜单时关闭当前菜单

       参数：category - 要切换到的分类名
             brandName - 品牌名称（可选）
             isMainNav - 是否是主菜单点击（可选）
    */
    function switchCategory(top, sub, label) {
      currentTop = top;            // 一级分类（大分类）
      currentSub = sub || '';      // 二级分类（小分类），'' 表示不限

      // 更新导航按钮的选中状态
      navBtns.forEach(btn => {
        if (top === 'all') {
          // “全部”按钮
          btn.classList.toggle('active', btn.dataset.top === 'all');
        } else if (sub) {
          // 子分类按钮：data-top + data-sub 同时匹配
          btn.classList.toggle('active', btn.dataset.top === top && btn.dataset.sub === sub);
        } else {
          // 主导航（大分类）按钮：有 data-top 且无 data-sub（含独立大分类）
          btn.classList.toggle('active', btn.dataset.top === top && !btn.dataset.sub);
        }
      });

      // 更新分类标题文字
      if (top === 'all') {
        sectionTitle.textContent = '全部鞋款';
      } else {
        sectionTitle.textContent = label || top;
      }

      // 重新渲染图片
      renderGallery();
    }

    // 关闭所有下拉菜单
    function closeAllDropdowns() {
      document.querySelectorAll('.nav-dropdown.active').forEach(d => d.classList.remove('active'));
    }

    /* ============================
       11.7 事件监听（给按钮绑定点击功能）【已修改】
    ============================ */

    // 给所有导航按钮绑定点击事件（主导航 + 下拉子分类 + 独立大分类 统一处理）
    navBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();  // 阻止冒泡，避免触发 document 的关闭逻辑
        const top = btn.dataset.top;

        // “全部”按钮
        if (top === 'all') {
          closeAllDropdowns();
          switchCategory('all');
          return;
        }

        // 主导航（带下拉的大分类）：展开/收起菜单，并显示该大类全部商品
        if (btn.classList.contains('nav-dropbtn')) {
          const label = btn.textContent.replace('▼', '').trim();
          const dropdown = btn.closest('.nav-dropdown');
          if (dropdown.classList.contains('active')) {
            dropdown.classList.remove('active');
          } else {
            closeAllDropdowns();
            dropdown.classList.add('active');
          }
          // sub 为空 → 显示该大类全部（含子分类 + 直接挂图）
          switchCategory(top, '', label);
          return;
        }

        // 子分类按钮 / 独立大分类按钮
        closeAllDropdowns();
        const sub = btn.dataset.sub || '';
        switchCategory(top, sub, sub ? sub : top);
      });
    });

    // 点击页面其他地方，关闭所有下拉菜单
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-dropdown')) {
        closeAllDropdowns();
      }
    });

    // 点击关闭按钮关闭弹窗
    modalClose.addEventListener('click', closeModal);

    // 点击弹窗背景也能关闭弹窗
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // 按 ESC 键关闭弹窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ============================
       11.8 初始化（页面加载时执行）
       ============================ */
    // 页面打开时，默认显示所有鞋子
    renderGallery();

    /* ============================
       11.9 搜索功能初始化
       ============================ */
    // 监听搜索框输入
    searchInput.addEventListener('input', (e) => {
      performSearch(e.target.value);
    });

    // 按回车搜索
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        performSearch(e.target.value);
      }
    });

    // === A. 底部固定栏功能 ===
    // 页面滚动时显示/隐藏底部栏
    window.addEventListener('scroll', () => {
      const bottomBar = document.getElementById('bottomBar');
      if (window.scrollY > 300) {
        bottomBar.classList.add('show');
      } else {
        bottomBar.classList.remove('show');
      }
    });

    // 滚动触底自动加载更多
    window.addEventListener('scroll', () => {
      if (isLoading) return;
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight;
      const clientHeight = window.innerHeight;
      if (scrollTop + clientHeight >= scrollHeight - 300) {
        loadMore(true);
      }
    });

    // 加载更多按钮
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      loadMore(true);
    });

    /* ============================
       12. 日常 / 节日 双 UI 切换
       ============================
       逻辑说明：
       1. 复用价格引擎的 isPromoNow() 判断当前是否处于节日特惠期，
          不自建日期逻辑，保证 UI 与价格口径完全一致。
       2. localStorage 键 aj5_ui_mode，三种值：
          'auto'     跟随节日自动（首次进入的默认值）
          'daily'    用户手动选了日常 —— 刷新后保持日常，不被强制拉回
          'festival' 用户手动选了节日
       3. 横幅文案取自 isPromoNow().festival.name（如「中秋节」），动态生成。
    */

    const UI_MODE_KEY = 'aj5_ui_mode';        // localStorage 键
    const uiModeToggle      = document.getElementById('uiModeToggle');
    const uiModeToggleIcon  = document.getElementById('uiModeToggleIcon');
    const uiModeToggleText  = document.getElementById('uiModeToggleText');
    const festivalTitleEl   = document.getElementById('festivalTitle');
    const festivalDescEl    = document.getElementById('festivalDesc');
    const festivalCtaEl     = document.getElementById('festivalCta');

    /**
     * 读取用户保存的模式偏好。
     * @returns {'auto'|'daily'|'festival'} 默认 'auto'
     */
    function getSavedUiMode() {
      let v = 'auto';
      try { v = localStorage.getItem(UI_MODE_KEY) || 'auto'; } catch (e) {}
      return (v === 'daily' || v === 'festival') ? v : 'auto';
    }

    /**
     * 根据「用户偏好 + 当前节日状态」算出实际应使用的模式。
     * @returns {{mode:'daily'|'festival', promo:object}} promo 为 isPromoNow() 的返回值
     */
    function resolveUiMode() {
      const saved = getSavedUiMode();           // 用户偏好
      const promo = isPromoNow();               // 复用价格引擎：当前是否特惠期
      let mode;
      if (saved === 'daily') {
        mode = 'daily';                         // 用户明确选了日常 → 始终保持日常
      } else if (saved === 'festival') {
        mode = 'festival';                      // 用户明确选了节日 → 始终保持节日
      } else {
        mode = promo.active ? 'festival' : 'daily';  // auto：跟随节日自动
      }
      return { mode: mode, promo: promo };
    }

    /**
     * 应用 UI 模式：把 festival-mode 类挂到 body 上，并同步按钮和横幅文案。
     * @param {'daily'|'festival'} mode
     * @param {object} promo isPromoNow() 的返回值（用于取节日名）
     */
    function applyUiMode(mode, promo) {
      const isFestival = (mode === 'festival');

      // ① 核心：切换 body 上的 class —— 所有节日皮肤都由它驱动
      document.body.classList.toggle('festival-mode', isFestival);

      // ② 切换按钮的图标与文字（措辞用「主题」，明确只换皮肤、不改价格口径）
      if (uiModeToggleIcon) uiModeToggleIcon.textContent = isFestival ? '🎊' : '🌤';
      if (uiModeToggleText) uiModeToggleText.textContent = isFestival ? '节日主题' : '日常主题';
      if (uiModeToggle) uiModeToggle.setAttribute('aria-pressed', String(isFestival));

      // ③ 横幅文案：用节日的真实名字动态生成，不写死
      const festivalName = (promo && promo.festival) ? promo.festival.name : '节日';
      if (festivalTitleEl) festivalTitleEl.textContent = festivalName + '特惠';
      if (festivalDescEl) {
        // 特惠期：显示包邮规则；非特惠期（用户手动开节日）：显示通用文案
        festivalDescEl.textContent = (promo && promo.active)
          ? '限时特惠 · 两双以上包邮'
          : '限时特惠进行中';
      }
      // ④ 横幅显隐完全交给 CSS（body.festival-mode #festivalBanner），此处不碰 display
    }

    /** 切换按钮点击：在两种模式间切换，并记录用户偏好 */
    if (uiModeToggle) {
      uiModeToggle.addEventListener('click', () => {
        const isNowFestival = document.body.classList.contains('festival-mode');
        const nextMode = isNowFestival ? 'daily' : 'festival';
        try { localStorage.setItem(UI_MODE_KEY, nextMode); } catch (e) {}
        applyUiMode(nextMode, isPromoNow());
      });
    }

    /** 横幅「立即查看」：平滑滚动到商品区 */
    if (festivalCtaEl) {
      festivalCtaEl.addEventListener('click', () => {
        const g = document.getElementById('gallery');
        if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    // 页面加载即应用一次（auto 模式下今天若在特惠期，会自动进入节日版）
    (function initUiMode() {
      const r = resolveUiMode();
      applyUiMode(r.mode, r.promo);
      // 仅控制台提示：说明「主题」只影响皮肤，价格始终按当日日历计算
      console.log('[aj5] 主题:' + (r.mode === 'festival' ? '节日' : '日常') + '（价格始终按当日日历计算）');
    })();

  
    /* ============================================================
       13. 移动端电商交互（脚本补丁注入）
       ============================================================
       · 手机（≤768px）：点一级分类 → 底部弹层出二级；底部 4 入口可用；底部栏常驻
       · 桌面（>768px）：完全沿用原有下拉逻辑，本段自动旁路
       ============================================================ */
    (function initMobileEcommerce() {
      var mq = window.matchMedia('(max-width: 768px)');
      var sheet      = document.getElementById('subSheet');
      var sheetMask  = document.getElementById('sheetMask');
      var sheetPanel = document.getElementById('sheetPanel');
      var sheetTitle = document.getElementById('sheetTitle');
      var sheetClose = document.getElementById('sheetClose');
      var sheetGrid  = document.getElementById('sheetGrid');
      var bottomBarEl = document.getElementById('bottomBar');
      if (!sheet || !sheetGrid) return;

      var openFlag = false;

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function openSheet(top, label, children) {
        sheetTitle.textContent = label || '选择分类';
        var subs = String(children || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
        var cur = (typeof currentSub !== 'undefined') ? currentSub : '';
        var html = '<button class="sheet-item' + (cur ? '' : ' active') + '" type="button"'
                 + ' data-top="' + top + '" data-sub="">全部</button>';
        html += subs.map(function (s) {
          return '<button class="sheet-item' + (cur === s ? ' active' : '') + '" type="button"'
               + ' data-top="' + top + '" data-sub="' + s + '">' + escapeHtml(s) + '</button>';
        }).join('');
        sheetGrid.innerHTML = html;
        if (sheetMask) sheetMask.classList.add('show');
        if (sheetPanel) sheetPanel.classList.add('show');
        sheet.classList.add('open');
        document.body.classList.add('sheet-locked');
        openFlag = true;
      }

      function closeSheet() {
        if (sheetMask) sheetMask.classList.remove('show');
        if (sheetPanel) sheetPanel.classList.remove('show');
        sheet.classList.remove('open');
        document.body.classList.remove('sheet-locked');
        openFlag = false;
      }

      /* 弹层内点击二级项 → 切换分类 + 关弹层 */
      sheetGrid.addEventListener('click', function (e) {
        var item = e.target.closest('.sheet-item');
        if (!item) return;
        var top = item.dataset.top;
        var sub = item.dataset.sub || '';
        var label = sheetTitle.textContent || top;
        closeSheet();
        switchCategory(top, sub, sub ? sub : label);
        var g = document.getElementById('gallery');
        if (g) setTimeout(function () { g.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
      });

      if (sheetMask) sheetMask.addEventListener('click', closeSheet);
      if (sheetClose) sheetClose.addEventListener('click', closeSheet);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && openFlag) closeSheet();
      });

      /* 移动端：一级分类点击改为开弹层（捕获阶段抢先处理） */
      var navLinks = document.querySelector('.nav-links');
      if (navLinks) {
        navLinks.addEventListener('click', function (e) {
          if (!mq.matches) return;
          var btn = e.target.closest('.nav-btn');
          if (!btn) return;
          if (btn.dataset.top === 'all') return;      // "全部" 交给原逻辑
          var children = btn.dataset.children;
          if (children) {
            e.stopPropagation(); e.preventDefault();
            var label = btn.textContent.replace('▼', '').trim();
            openSheet(btn.dataset.top, label, children);
          } else if (openFlag) {
            closeSheet();
          }
        }, true);
      }

      /* 底部 4 入口 */
      var bbHome = document.getElementById('bbHome');
      var bbCate = document.getElementById('bbCate');
      var bbSearch = document.getElementById('bbSearch');
      var bbContact = document.getElementById('bbContact');

      function setActiveBb(el) {
        [bbHome, bbCate, bbSearch, bbContact].forEach(function (b) {
          if (b) b.classList.toggle('active', b === el);
        });
      }

      if (bbHome) bbHome.addEventListener('click', function () {
        setActiveBb(bbHome); closeSheet();
        switchCategory('all');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      if (bbCate) bbCate.addEventListener('click', function () {
        setActiveBb(bbCate);
        var target = document.querySelector('.nav-btn.active[data-top]:not([data-top="all"])');
        if (!target || !target.dataset.children) {
          target = document.querySelector('.nav-btn[data-children]');
        }
        if (target && target.dataset.children) {
          var label = target.textContent.replace('▼', '').trim();
          openSheet(target.dataset.top, label, target.dataset.children);
        } else {
          var nav = document.querySelector('.nav-bottom-row') || document.querySelector('.navbar');
          if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      if (bbSearch) bbSearch.addEventListener('click', function () {
        setActiveBb(bbSearch); closeSheet();
        var nav = document.querySelector('.navbar');
        if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
        var si = document.getElementById('searchInput');
        if (si) setTimeout(function () {
          try { si.focus({ preventScroll: true }); } catch (err) { si.focus(); }
        }, 260);
      });

      if (bbContact) bbContact.addEventListener('click', function () {
        setActiveBb(bbContact); closeSheet();
        openContactSheet();
      });

      function openContactSheet() {
        var el = document.getElementById('wechatId');
        var wechat = (el && el.textContent) ? el.textContent.trim() : 'xdq880406';
        sheetTitle.textContent = '联系客服';
        sheetGrid.innerHTML =
          '<div class="contact-sheet">' +
            '<img class="contact-sheet-qr" src="wechat-qr.png" alt="微信二维码"' +
            ' onerror="this.style.display=\'none\'">' +
            '<p class="contact-sheet-tip">扫码添加微信，或复制微信号</p>' +
            '<p class="contact-sheet-id">' + escapeHtml(wechat) + '</p>' +
            '<button class="contact-sheet-copy" type="button" id="contactSheetCopy">复制微信号</button>' +
          '</div>';
        if (sheetMask) sheetMask.classList.add('show');
        if (sheetPanel) sheetPanel.classList.add('show');
        sheet.classList.add('open');
        document.body.classList.add('sheet-locked');
        openFlag = true;
        var copyBtn = document.getElementById('contactSheetCopy');
        if (copyBtn) copyBtn.addEventListener('click', function () {
          copyWechat();
          copyBtn.textContent = '已复制 ✓';
          setTimeout(function () { copyBtn.textContent = '复制微信号'; }, 1600);
        });
      }

      /* 补齐原页面缺失的 copyWechat 实现（onclick="copyWechat()" 一直在引用它） */
      if (typeof window.copyWechat !== 'function') {
        window.copyWechat = function () {
          var el = document.getElementById('wechatId');
          var text = (el && el.textContent) ? el.textContent.trim() : 'xdq880406';
          var done = function () {
            var btn = document.querySelector('.modal-copy-btn');
            if (btn) {
              if (!btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
              btn.innerHTML = '已复制 ✓';
              setTimeout(function () { btn.innerHTML = btn.dataset.orig; }, 1600);
            }
          };
          var fallback = function (t) {
            var ta = document.createElement('textarea');
            ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text); done(); });
          } else { fallback(text); done(); }
        };
      }

      /* 底部栏：手机端常驻，桌面端保留原滚动显隐 */
      function syncBottomBar() {
        if (!bottomBarEl) return;
        if (mq.matches) {
          bottomBarEl.classList.add('show');
          bottomBarEl.classList.remove('hidden');
        } else {
          bottomBarEl.classList.remove('show');
          bottomBarEl.classList.remove('hidden');
        }
      }
      syncBottomBar();
      if (mq.addEventListener) mq.addEventListener('change', syncBottomBar);
      else if (mq.addListener) mq.addListener(syncBottomBar);
      window.addEventListener('resize', syncBottomBar);
      window.addEventListener('orientationchange', syncBottomBar);

      window.__aj5Mobile = { openSheet: openSheet, closeSheet: closeSheet, syncBottomBar: syncBottomBar };
      console.log('[aj5] 移动端电商交互已就绪（≤768px 生效）');
    })();


    /* 新款角标：数据层 sync.py 给最新 30 款打的 isNew 标记 */
    function newBadge(shoe) {
      if (shoe && shoe.isNew) {
        return '<span class="card-badge card-badge--new">新款</span>';
      }
      return '';
    }

  /* ==== UI-VARIANTS PATCH JS START ==== */
    /* ============================================================
       14. 版式轴 + 外观设置（脚本补丁注入）
           · 版式存 localStorage.aj5_ui_layout = std | shelf | list
           · 主题沿用既有 localStorage.aj5_ui_mode（auto | daily | festival）
           · 手机端：右上角浮动按钮已隐藏，改由底部「外观」入口打开设置弹层
           ============================================================ */
    (function initUiVariants() {
      var LAYOUT_KEY = 'aj5_ui_layout';
      var LAYOUTS = ['std', 'shelf', 'list'];
      var mqMobile = window.matchMedia('(max-width: 768px)');

      /* ---------- 版式读写 ---------- */
      function getLayout() {
        var v = 'std';
        try { v = localStorage.getItem(LAYOUT_KEY) || 'std'; } catch (e) {}
        return LAYOUTS.indexOf(v) >= 0 ? v : 'std';
      }
      function applyLayout(name) {
        if (LAYOUTS.indexOf(name) < 0) name = 'std';
        LAYOUTS.forEach(function (n) {
          document.body.classList.toggle('layout-' + n, n === name);
        });
        document.body.setAttribute('data-layout', name);
        // 版式切换后重排列表（网格/清单列数变化需要复位分页）
        try { renderGallery(); } catch (e) {}
        // 清单版深色顶栏高度实测后写回，供 #sortBar 的 sticky top 用
        syncSortBarOffset();
      }
      function syncSortBarOffset() {
        var nav = document.querySelector('.navbar');
        var bar = document.getElementById('sortBar');
        if (!nav || !bar) return;
        var h = Math.round(nav.getBoundingClientRect().height);
        if (document.body.classList.contains('layout-list') && h > 0) {
          bar.style.top = h + 'px';
        } else {
          bar.style.top = '';
        }
      }

      /* ---------- 主题读写（复用既有 applyUiMode / isPromoNow） ---------- */
      function getTheme() {
        var v = 'auto';
        try { v = localStorage.getItem(UI_MODE_KEY) || 'auto'; } catch (e) {}
        return (v === 'daily' || v === 'festival') ? v : 'auto';
      }
      function setTheme(v) {
        try { localStorage.setItem(UI_MODE_KEY, v); } catch (e) {}
        var promo = (typeof isPromoNow === 'function') ? isPromoNow() : {};
        var real = (v === 'auto') ? ((promo && promo.active) ? 'festival' : 'daily') : v;
        applyUiMode(real, promo);
        syncThemeRow();
        syncLookIcon();
      }

      /* ---------- 外观弹层 ---------- */
      var varSheet = document.getElementById('uiVarSheet');
      var varMask  = document.getElementById('varMask');
      var varPanel = document.getElementById('varPanel');
      var varClose = document.getElementById('varClose');

      function openVarSheet() {
        if (!varSheet) return;
        syncThemeRow(); syncLayoutRow();
        varSheet.classList.add('open');
        document.body.classList.add('sheet-locked');
        if (varMask)  varMask.classList.add('show');
        if (varPanel) varPanel.classList.add('show');
      }
      function closeVarSheet() {
        if (!varSheet) return;
        varSheet.classList.remove('open');
        document.body.classList.remove('sheet-locked');
        if (varMask)  varMask.classList.remove('show');
        if (varPanel) varPanel.classList.remove('show');
      }
      if (varMask)  varMask.addEventListener('click', closeVarSheet);
      if (varClose) varClose.addEventListener('click', closeVarSheet);

      function syncThemeRow() {
        var cur = getTheme();
        var row = document.getElementById('varThemeRow');
        if (!row) return;
        row.querySelectorAll('.var-opt').forEach(function (b) {
          b.classList.toggle('active', b.dataset.theme === cur);
          b.setAttribute('aria-pressed', String(b.dataset.theme === cur));
        });
      }
      function syncLayoutRow() {
        var cur = getLayout();
        var row = document.getElementById('varLayoutRow');
        if (!row) return;
        row.querySelectorAll('.var-opt').forEach(function (b) {
          b.classList.toggle('active', b.dataset.layout === cur);
          b.setAttribute('aria-pressed', String(b.dataset.layout === cur));
        });
      }

      var themeRow = document.getElementById('varThemeRow');
      if (themeRow) {
        themeRow.addEventListener('click', function (e) {
          var b = e.target.closest('.var-opt');
          if (!b) return;
          setTheme(b.dataset.theme);
        });
      }
      var layoutRow = document.getElementById('varLayoutRow');
      if (layoutRow) {
        layoutRow.addEventListener('click', function (e) {
          var b = e.target.closest('.var-opt');
          if (!b) return;
          var v = b.dataset.layout;
          try { localStorage.setItem(LAYOUT_KEY, v); } catch (er) {}
          applyLayout(v);
          syncLayoutRow();
        });
      }

      /* ---------- 手机端：拦截浮动按钮，改为弹设置层 ---------- */
      document.addEventListener('click', function (e) {
        if (!mqMobile.matches) return;
        var t = e.target.closest && e.target.closest('#uiModeToggle');
        if (!t) return;
        e.preventDefault();
        e.stopPropagation();
        openVarSheet();
      }, true);

      /* ---------- 底部「外观」入口 ---------- */
      var bbLook = document.getElementById('bbLook');
      if (bbLook) {
        bbLook.addEventListener('click', function (e) {
          e.preventDefault();
          openVarSheet();
        });
      }
      function syncLookIcon() {
        if (!bbLook) return;
        var icon = bbLook.querySelector('.bb-icon');
        if (!icon) return;
        var fest = document.body.classList.contains('festival-mode');
        var lay = getLayout();
        icon.textContent = fest ? '🎊' : (lay === 'list' ? '☰' : (lay === 'shelf' ? '🧱' : '🎨'));
      }

      /* ---------- 排序条（清单版） ---------- */
      function priceNum(shoe) {
        try {
          var p = calcPrice(shoe);
          var raw = p.special || p.original || '0';
          return parsePriceValue(raw);
        } catch (e) { return 0; }
      }
      var sortMode = 'default';
      function doSort(mode) {
        sortMode = mode;
        if (mode === 'default') { renderGallery(); return; }
        var arr = filteredShoes.slice();
        arr.sort(function (a, b) {
          var d = priceNum(a) - priceNum(b);
          return mode === 'price-asc' ? d : -d;
        });
        filteredShoes = arr;
        displayCount = 0;
        loadMore(false);
      }
      var sortBar = document.getElementById('sortBar');
      if (sortBar) {
        sortBar.addEventListener('click', function (e) {
          var b = e.target.closest('.sort-item');
          if (!b) return;
          sortBar.querySelectorAll('.sort-item').forEach(function (x) {
            var on = x === b;
            x.classList.toggle('active', on);
            x.setAttribute('aria-selected', String(on));
          });
          doSort(b.dataset.sort);
        });
      }
      // 换了分类/搜索后仍保持当前排序
      var _origRenderGallery = renderGallery;
      renderGallery = function () {
        _origRenderGallery.apply(null, arguments);
        if (sortMode !== 'default') {
          var arr = filteredShoes.slice();
          arr.sort(function (a, b) {
            var d = priceNum(a) - priceNum(b);
            return sortMode === 'price-asc' ? d : -d;
          });
          filteredShoes = arr;
          displayCount = 0;
          loadMore(false);
        }
        syncSortBarOffset();
      };

      /* ---------- 软键盘：收起底部栏 ---------- */
      document.addEventListener('focusin', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
          document.body.classList.add('kb-open');
        }
      });
      document.addEventListener('focusout', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
          setTimeout(function () { document.body.classList.remove('kb-open'); }, 120);
        }
      });

      /* ---------- 窗口变化时校正 ---------- */
      var _rzT = null;
      window.addEventListener('resize', function () {
        clearTimeout(_rzT);
        _rzT = setTimeout(syncSortBarOffset, 150);
      });

      /* ---------- URL 直达参数（便于手机端分享与回归测试）----------
         ?v=std|shelf|list   ?theme=auto|daily|festival
         ---------------------------------------------------------- */
      var urlLayout = null, urlTheme = null;
      try {
        var sp = new URLSearchParams(location.search);
        var qv = sp.get('v');
        if (qv && LAYOUTS.indexOf(qv) >= 0) urlLayout = qv;
        var qt = sp.get('theme');
        if (qt && ['auto', 'daily', 'festival'].indexOf(qt) >= 0) urlTheme = qt;
      } catch (e) {}
      if (urlLayout) { try { localStorage.setItem(LAYOUT_KEY, urlLayout); } catch (e) {} }

      /* ---------- 打包 applyUiMode：主题一变就刷新「外观」图标 ---------- */
      var _origApplyUiMode = applyUiMode;
      applyUiMode = function () {
        _origApplyUiMode.apply(null, arguments);
        syncLookIcon();
      };

      /* ---------- 启动 ---------- */
      if (urlTheme) setTheme(urlTheme);
      applyLayout(getLayout());
      syncThemeRow();
      syncLayoutRow();
      syncLookIcon();
      syncSortBarOffset();
    })();

    /* 卡片角标：aj 一口价 / 节日特惠（默认隐藏，仅货架版显示） */
    function cardBadge(shoe, price) {
      if (!price) return '';
      if (price.isAj) {
        return '<span class="card-badge card-badge--fixed">一口价</span>';
      }
      if (price.isPromo) {
        return '<span class="card-badge card-badge--hot">节日特惠</span>';
      }
      return '';
    }

  /* ==== UI-VARIANTS PATCH JS END ==== */
  </script>
</body>
