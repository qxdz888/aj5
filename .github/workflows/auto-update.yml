name: Auto Update Shoes Gallery

# 2026-10-13 停用自动触发：该 Action 每次 push 后会重跑 update_gallery.py 并只 git add index.html，
# 生成的首屏内联数据不含新增商品（如鸿26056），会覆盖手动/同步脚本推送的正确版本，造成反复覆盖循环。
# 现由 sync.py 全权负责 scan→build→deploy→push，故此 Action 仅保留手动触发（workflow_dispatch），不再自动跑。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run update script
      run: python update_gallery.py
      
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # 只添加 index.html，不 pull
        git add index.html
        
        # 检查是否有变更
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "auto: update gallery $(date '+%Y-%m-%d %H:%M')"
          git push origin main
        fi
